[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aura"
version = "0.1.0"
description = "Autonomous Research Understanding & Reporting Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "AURA Team", email = "team@aura.dev"},
]

dependencies = [
    # Agent Framework
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",

    # Web & HTTP
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.4.0",
    "lxml>=5.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
    "neo4j>=5.14.0",

    # Data Processing
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",

    # PDF Processing
    "pymupdf>=1.23.0",
    "pypdf>=3.17.0",

    # NLP & ML
    "sentence-transformers>=2.2.0",
    "tiktoken>=0.5.0",

    # Scheduling & Tasks
    "apscheduler>=3.10.0",
    "celery>=5.3.0",
    "redis>=5.0.0",

    # Utilities
    "tenacity>=8.2.0",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "python-dateutil>=2.8.0",
    "jinja2>=3.1.0",
    "gitpython>=3.1.0",
    "docker>=7.0.0",
    "prometheus-client>=0.20.0",

    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
aura = "src.agent.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
